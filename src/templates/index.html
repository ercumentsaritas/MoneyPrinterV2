<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoneyPrinter V2</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <h1>💸 MoneyPrinter V2 💸</h1>

  <div class="container">
    
    <!-- LEFT PANEL: Controls -->
    <div class="panel">
      <div class="panel-title">CONTROL DECK</div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-youtube" onclick="switchTab('youtube')">[ YOUTUBE ]</button>
        <button class="tab-btn" id="tab-twitter" onclick="switchTab('twitter')">[ TWITTER ]</button>
      </div>

      <!-- YOUTUBE TAB -->
      <div id="youtube-view" class="tab-view active">
        <label for="account-select">PLAYER (YouTube Account):</label>
        <select id="account-select">
          <option value="">LOADING...</option>
        </select>

        <div style="margin: 15px 0;">
          <label style="cursor: pointer;">
            <input type="checkbox" id="upload-checkbox" style="width: auto; margin-right: 8px;" checked>
            UPLOAD TO YOUTUBE
          </label>
        </div>

        <button id="btn-generate" class="action-btn" onclick="startGeneration()">[ START GENERATION ]</button>
      </div>

      <!-- TWITTER TAB -->
      <div id="twitter-view" class="tab-view">
        <label for="twitter-account-select">PLAYER (Twitter Account):</label>
        <select id="twitter-account-select">
          <option value="">LOADING...</option>
        </select>

        <button id="btn-twitter-topic" class="action-btn" onclick="startTwitterGeneration('topic')">[ POST TOPIC ]</button>
        <button id="btn-twitter-viral" class="action-btn" onclick="startTwitterGeneration('viral_meme')">[ POST VIRAL MEME ]</button>
        <button id="btn-twitter-reply" class="action-btn" onclick="startTwitterGeneration('reply_viral')">[ REPLY VIRAL TWEET ]</button>
        <button id="btn-twitter-quote" class="action-btn" onclick="startTwitterGeneration('quote_viral')">[ QUOTE VIRAL TWEET ]</button>
      </div>
      
      <!-- SHARED STATUS AREA -->
      <div id="status-area" style="display: none; margin-top: 30px;">
        <div class="status-text blink" id="status-label">INITIALIZING...</div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div class="error-text" id="error-label" style="margin-top: 10px;"></div>
      </div>

      <div class="panel-title" style="top: auto; bottom: -14px;">GAME STATS</div>
      <div style="margin-top: 40px;">
        <div class="stat-box">
          <span>IMAGES (.png):</span><span id="stat-images">0</span>
        </div>
        <div class="stat-box">
          <span>AUDIO (.wav):</span><span id="stat-audio">0</span>
        </div>
        <div class="stat-box">
          <span>SUBS (.srt):</span><span id="stat-srt">0</span>
        </div>
        <div class="stat-box">
          <span>SONGS:</span><span id="stat-songs">0</span>
        </div>
        <button onclick="refreshStats()" style="margin-top:5px; padding: 10px;">REFRESH STATS</button>
      </div>
    </div>

    <!-- RIGHT PANEL: Settings -->
    <div class="panel" style="overflow-y: auto; max-height: 500px;">
      <div class="panel-title">GAME SETTINGS</div>
      <div class="tabs">
        <button class="tab-btn active" id="settings-tab-youtube" onclick="switchSettingsTab('youtube')">[ YOUTUBE SETTINGS ]</button>
        <button class="tab-btn" id="settings-tab-twitter" onclick="switchSettingsTab('twitter')">[ TWITTER SETTINGS ]</button>
      </div>

      <div id="settings-youtube-view" class="tab-view active">
        <form id="settings-youtube-form" onsubmit="saveYouTubeSettings(event)">
          <div id="settings-youtube-container">LOADING YOUTUBE SETTINGS...</div>
          <button type="submit" id="btn-save-youtube-settings">[ SAVE YOUTUBE SETTINGS ]</button>
        </form>
      </div>

      <div id="settings-twitter-view" class="tab-view">
        <form id="settings-twitter-form" onsubmit="saveTwitterSettings(event)">
          <div id="settings-twitter-container">LOADING TWITTER SETTINGS...</div>
          <button type="submit" id="btn-save-twitter-settings">[ SAVE TWITTER SETTINGS ]</button>
        </form>
      </div>
      <div id="settings-msg" class="blink" style="color: yellow; margin-top:10px; font-size: 10px;"></div>
    </div>

    <!-- BOTTOM PANEL: Videos -->
    <div class="panel full-width">
      <div class="panel-title">INVENTORY (VIDEOS)</div>
      <ul class="video-list" id="video-list">
        <li>LOADING INVENTORY...</li>
      </ul>
    </div>

  </div>

  <script>
    let pollInterval = null;
    let currentYouTubeConfig = {};
    let currentTwitterSettings = {};

    async function fetchAccounts() {
      try {
        const res = await fetch('/api/accounts');
        const accs = await res.json();
        const sel = document.getElementById('account-select');
        sel.innerHTML = '';
        if (accs.length === 0) {
          sel.innerHTML = '<option>NO ACCOUNTS FOUND</option>';
          document.getElementById('btn-generate').disabled = true;
          return;
        }
        accs.forEach((acc, index) => {
          let opt = document.createElement('option');
          opt.value = index;
          opt.innerText = `${acc.nickname} (${acc.niche})`;
          sel.appendChild(opt);
        });
      } catch (e) { console.error(e); }
    }

    async function fetchTwitterAccounts() {
      try {
        const res = await fetch('/api/twitter_accounts');
        const accs = await res.json();
        const sel = document.getElementById('twitter-account-select');
        sel.innerHTML = '';
        if (accs.length === 0) {
          sel.innerHTML = '<option>NO ACCOUNTS FOUND</option>';
          document.getElementById('btn-twitter-topic').disabled = true;
          document.getElementById('btn-twitter-viral').disabled = true;
          return;
        }
        accs.forEach((acc, index) => {
          let opt = document.createElement('option');
          opt.value = index;
          opt.innerText = `${acc.nickname} (${acc.topic || 'No topic'})`;
          sel.appendChild(opt);
        });
      } catch (e) { console.error(e); }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId + '-view').classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
      switchSettingsTab(tabId);
    }

    function switchSettingsTab(tabId) {
      document.querySelectorAll('#settings-youtube-view, #settings-twitter-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('#settings-tab-youtube, #settings-tab-twitter').forEach(el => el.classList.remove('active'));

      document.getElementById('settings-' + tabId + '-view').classList.add('active');
      document.getElementById('settings-tab-' + tabId).classList.add('active');
    }

    async function fetchStats() {
      try {
        const resA = await fetch('/api/assets');
        const assets = await resA.json();
        document.getElementById('stat-images').innerText = assets.images;
        document.getElementById('stat-audio').innerText = assets.audio;
        document.getElementById('stat-srt').innerText = assets.srt;

        const resS = await fetch('/api/songs');
        const songs = await resS.json();
        document.getElementById('stat-songs').innerText = songs.length;
      } catch (e) { console.error(e); }
    }

    async function fetchVideos() {
      try {
        const res = await fetch('/api/videos');
        const videos = await res.json();
        const list = document.getElementById('video-list');
        list.innerHTML = '';
        if (videos.length === 0) {
          list.innerHTML = '<li>INVENTORY EMPTY (NO MP4 FILES)</li>';
          return;
        }
        videos.forEach(v => {
          let li = document.createElement('li');
          li.innerHTML = `<span>${v.name}</span> <span>${v.size_mb} MB | ${v.modified}</span>`;
          list.appendChild(li);
        });
      } catch(e) { console.error(e); }
    }

    async function fetchYouTubeSettings() {
      try {
        const res = await fetch('/api/settings/youtube');
        currentYouTubeConfig = await res.json();
        const container = document.getElementById('settings-youtube-container');
        container.innerHTML = '';
        
        for (const [key, value] of Object.entries(currentYouTubeConfig)) {
            let wrap = document.createElement('div');
            wrap.style.marginBottom = "15px";

            let lbl = document.createElement('label');
            lbl.innerText = key.toUpperCase().replace(/_/g, ' ');
            wrap.appendChild(lbl);

            let inp = document.createElement('input');
            inp.name = key;
            inp.id = `cfg_${key}`;
            inp.style.marginBottom = "0px";

            if (typeof value === "boolean") {
                inp.type = "checkbox";
                inp.checked = value;
                inp.style.width = "auto";
                // Layout adjustment for checkbox
                wrap.style.display = "flex";
                wrap.style.alignItems = "center";
                wrap.style.gap = "10px";
                lbl.style.marginBottom = "0";
            } else if (typeof value === "number") {
                inp.type = "number";
                inp.value = value;
            } else {
                inp.type = "text";
                inp.value = value;
            }
            wrap.appendChild(inp);
            container.appendChild(wrap);
        }
      } catch(e) { console.error(e); }
    }

    async function saveYouTubeSettings(e) {
      e.preventDefault();
      const payload = {};
      const inputs = document.querySelectorAll('#settings-youtube-container input');
      inputs.forEach(inp => {
          if (inp.type === "checkbox") {
              payload[inp.name] = inp.checked;
          } else if (inp.type === "number") {
              payload[inp.name] = Number(inp.value);
          } else {
              payload[inp.name] = inp.value;
          }
      });

      const msg = document.getElementById('settings-msg');
      try {
          msg.innerText = "SAVING...";
          const res = await fetch('/api/settings/youtube', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(payload)
          });
          if(res.ok) {
              msg.innerText = "SETTINGS SAVED!";
              setTimeout(() => { msg.innerText = ""; }, 3000);
          } else { throw new Error("Server error"); }
      } catch (err) {
          msg.innerText = "ERROR SAVING SETTINGS";
      }
    }

    async function fetchTwitterSettings() {
      try {
        const idx = document.getElementById('twitter-account-select').value || 0;
        const res = await fetch(`/api/settings/twitter?account_index=${idx}`);
        currentTwitterSettings = await res.json();
        const container = document.getElementById('settings-twitter-container');
        container.innerHTML = '';

        if (!currentTwitterSettings.account) {
          container.innerHTML = '<div>NO TWITTER ACCOUNT SELECTED</div>';
          return;
        }

        const fieldMap = {
          "nickname": currentTwitterSettings.account.nickname,
          "topic": currentTwitterSettings.account.topic,
          "account_firefox_profile": currentTwitterSettings.account.firefox_profile,
          "twitter_language": currentTwitterSettings.config.twitter_language,
          "headless": currentTwitterSettings.config.headless,
          "default_firefox_profile": currentTwitterSettings.config.firefox_profile
        };

        for (const [key, value] of Object.entries(fieldMap)) {
          let wrap = document.createElement('div');
          wrap.style.marginBottom = "15px";

          let lbl = document.createElement('label');
          lbl.innerText = key.toUpperCase().replace(/_/g, ' ');
          wrap.appendChild(lbl);

          let inp = document.createElement('input');
          inp.name = key;
          inp.id = `tw_${key}`;
          inp.style.marginBottom = "0px";

          if (typeof value === "boolean") {
            inp.type = "checkbox";
            inp.checked = value;
            inp.style.width = "auto";
            wrap.style.display = "flex";
            wrap.style.alignItems = "center";
            wrap.style.gap = "10px";
            lbl.style.marginBottom = "0";
          } else {
            inp.type = "text";
            inp.value = value || "";
          }

          wrap.appendChild(inp);
          container.appendChild(wrap);
        }
      } catch (e) { console.error(e); }
    }

    async function saveTwitterSettings(e) {
      e.preventDefault();
      const idx = document.getElementById('twitter-account-select').value;
      if (idx === "") return;

      const account_updates = {};
      const config_updates = {};
      const inputs = document.querySelectorAll('#settings-twitter-container input');

      inputs.forEach(inp => {
        const value = inp.type === "checkbox" ? inp.checked : inp.value;
        if (inp.name === "nickname" || inp.name === "topic") {
          account_updates[inp.name] = value;
        } else if (inp.name === "account_firefox_profile") {
          account_updates["firefox_profile"] = value;
        } else if (inp.name === "twitter_language" || inp.name === "headless") {
          config_updates[inp.name] = value;
        } else if (inp.name === "default_firefox_profile") {
          config_updates["firefox_profile"] = value;
        }
      });

      const msg = document.getElementById('settings-msg');
      try {
        msg.innerText = "SAVING...";
        const res = await fetch('/api/settings/twitter', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            account_index: parseInt(idx),
            account_updates,
            config_updates
          })
        });
        if (res.ok) {
          msg.innerText = "TWITTER SETTINGS SAVED!";
          fetchTwitterAccounts();
          setTimeout(() => { msg.innerText = ""; }, 3000);
        } else {
          throw new Error("Server error");
        }
      } catch (err) {
        msg.innerText = "ERROR SAVING TWITTER SETTINGS";
      }
    }

    function refreshStats() {
      fetchStats();
      fetchVideos();
    }

    async function startGeneration() {
      const idx = document.getElementById('account-select').value;
      const upload = document.getElementById('upload-checkbox').checked;
      if (idx === "") return;

      document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);
      document.getElementById('status-area').style.display = 'block';
      document.getElementById('error-label').innerText = '';
      
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({account_index: parseInt(idx), upload_video: upload})
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert('Error: ' + err.error);
          document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
          return;
        }

        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(pollStatus, 2000);
      } catch (e) { console.error(e); }
    }

    async function startTwitterGeneration(actionType) {
      const idx = document.getElementById('twitter-account-select').value;
      if (idx === "") return;

      document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);
      document.getElementById('status-area').style.display = 'block';
      document.getElementById('error-label').innerText = '';
      
      try {
        const res = await fetch('/api/generate_twitter', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({account_index: parseInt(idx), action: actionType})
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert('Error: ' + err.error);
          document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
          return;
        }

        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(pollStatus, 2000);
      } catch (e) { console.error(e); }
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/generation-status');
        const state = await res.json();

        document.getElementById('status-label').innerText = state.step.toUpperCase();
        document.getElementById('progress-bar').style.width = state.progress + '%';
        
        fetchStats();

        if (state.error) {
          clearInterval(pollInterval);
          document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
          document.getElementById('error-label').innerText = 'ERROR: ' + state.error;
          document.getElementById('status-label').classList.remove('blink');
        } else if (!state.running && state.progress === 100) {
          clearInterval(pollInterval);
          document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
          document.getElementById('status-label').innerText = 'MISSION ACCOMPLISHED!';
          document.getElementById('status-label').classList.remove('blink');
          refreshStats();
        }
      } catch (e) { console.error(e); }
    }

    window.onload = () => {
      fetchAccounts();
      fetchTwitterAccounts();
      fetchYouTubeSettings();
      fetchTwitterSettings();
      refreshStats();
    };

    document.addEventListener('change', (e) => {
      if (e.target && e.target.id === 'twitter-account-select') {
        fetchTwitterSettings();
      }
    });
  </script>
</body>
</html>
